<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fdf4ff" />
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#4338ca" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- decorative blobs -->
  <circle cx="120" cy="90" r="160" fill="#a5b4fc" opacity="0.25" />
  <circle cx="1100" cy="520" r="200" fill="#f0abfc" opacity="0.2" />
  <circle cx="1050" cy="80" r="110" fill="#7dd3fc" opacity="0.18" />

  <!-- logo mark -->
  <rect x="90" y="88" width="72" height="72" rx="18" fill="url(#mark)" />
  <path d="M132 104 L104 140 H126 L118 168 L146 132 H124 L132 104 Z" fill="white" />

  <text x="176" y="140" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18181b">ContentForge AI</text>

  <!-- headline -->
  <text x="90" y="250" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#18181b">Never stare at a</text>
  <text x="90" y="316" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="url(#shimmer)">blank caption box again</text>

  <text x="90" y="366" font-family="Arial, sans-serif" font-size="22" fill="#52525b">AI-powered social captions · Free tier · Stripe subscriptions</text>

  <!-- mock caption card -->
  <g filter="url(#soft)">
    <rect x="90" y="420" width="620" height="150" rx="18" fill="#ffffff" stroke="#e4e4e7" />
  </g>
  <circle cx="122" cy="452" r="6" fill="#fca5a5" />
  <circle cx="142" cy="452" r="6" fill="#fde68a" />
  <circle cx="162" cy="452" r="6" fill="#86efac" />
  <text x="184" y="457" font-family="Arial, sans-serif" font-size="15" fill="#a1a1aa">Instagram · Playful</text>

  <text x="120" y="494" font-family="Arial, sans-serif" font-size="18" fill="#3f3f46">Brew-tiful news, friends! ☕ Our new cold brew flavor</text>
  <text x="120" y="520" font-family="Arial, sans-serif" font-size="18" fill="#3f3f46">launches this weekend — you won&#8217;t want to miss it! ✨</text>
  <text x="120" y="552" font-family="Arial, sans-serif" font-size="16" fill="#6366f1">#ColdBrewLove #NewFlavorAlert #CoffeeLovers</text>

  <!-- stack pills -->
  <g font-family="Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="760" y="440" width="140" height="36" rx="18" fill="#eef2ff" />
    <text x="830" y="463" fill="#4338ca" text-anchor="middle">Next.js 16</text>

    <rect x="760" y="486" width="140" height="36" rx="18" fill="#ecfeff" />
    <text x="830" y="509" fill="#0e7490" text-anchor="middle">Supabase</text>

    <rect x="910" y="440" width="140" height="36" rx="18" fill="#fdf4ff" />
    <text x="980" y="463" fill="#a21caf" text-anchor="middle">Stripe</text>

    <rect x="910" y="486" width="140" height="36" rx="18" fill="#fff7ed" />
    <text x="980" y="509" fill="#c2410c" text-anchor="middle">Groq LLM</text>
  </g>
</svg>
